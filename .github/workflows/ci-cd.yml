name: CI / CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks can stop. A production deployment must finish before
# another main run starts, so an older build cannot overwrite a newer one.
concurrency:
  group: ci-cd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      frontend-artifact-id: ${{ steps.frontend.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --keep-vars
      - name: Upload verified frontend
        id: frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://kingdom-of-spins.deskmind-site.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A deploy-only retry must reuse the successful checks job's artifact.
          artifact-ids: ${{ needs.checks.outputs.frontend-artifact-id }}
          path: dist/
      - name: Deploy Worker and verified assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN in the production environment secrets.'
            exit 1
          fi
          pnpm exec wrangler deploy --keep-vars --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID: $GITHUB_SHA"
      - name: Check deployed application
        run: pnpm check:deployment
      - name: Record deployment
        run: |
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'https://kingdom-of-spins.deskmind-site.workers.dev' >> "$GITHUB_STEP_SUMMARY"
